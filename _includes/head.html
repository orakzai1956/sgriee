<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- Mobile-First Viewport Tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <!-- Page Title & Primary Meta Description -->
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <!-- Robots & Crawlers Directives -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <!-- Geo-Targeting Meta Tags (Update region/geo details post-finalization) -->
  <meta name="geo.region" content="PK-PB"> <!-- Default region placeholder (e.g., Punjab, Pakistan) -->
  <meta name="geo.placename" content="Lahore">
  
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ '/assets/images/og-cover.jpg' | absolute_url }}"> <!-- Placeholder for social share image -->

  <!-- Twitter Card Data -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="twitter:image" content="{{ '/assets/images/og-cover.jpg' | absolute_url }}">

  <!-- Stylesheet Links -->
  <!-- <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}"> -->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

  <!-- Jekyll SEO Tag Plugin Integration -->
  {% seo %}

  <!-- Placeholder for Custom JSON-LD Structured Data (Geo/Local Business Schema) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}{{ site.baseurl }}"
  }
  </script>
</head>

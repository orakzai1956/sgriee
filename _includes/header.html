    <span class="phone-text">Prefer to speak directly?</span>
    <a href="tel:{{ site.whatsapp_number }}" class="phone-link">
      <svg class="phone-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">

</div>

  <div class="nav-container wrapper">
    <div class="nav-inner">
      <div class="site-logo">
        <a href="{{ '/' | relative_url }}">Frequency Inverter / VFD<br>Repairing & Supply of All Power Values</a>
      </div>

      <nav class="site-nav" id="siteNav">
        <ul class="nav-list">
          <li><a href="{{ '/' | relative_url }}" class="nav-link">Home</a></li>
          <li><a href="{{ '/products/' | relative_url }}" class="nav-link">Products</a></li>
          <li><a href="{{ '/about/' | relative_url }}" class="nav-link">About Us</a></li>
          <li><a href="{{ '/contact/' | relative_url }}" class="nav-link">Contact Us</a></li>
        </ul>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </div>
</header>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const toggleBtn = document.getElementById("menuToggle");
    const siteNav = document.getElementById("siteNav");

    if (toggleBtn && siteNav) {
      toggleBtn.addEventListener("click", function() {
        siteNav.classList.toggle("active");
        toggleBtn.classList.toggle("active");
      });
    }
  });
</script>
